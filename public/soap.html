<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOAP Tester | Just Food Delivery API</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo">🚀 Just Food Delivery API</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/rest.html">REST API</a>
      <a href="/soap.html" class="active">SOAP API</a>
      <button class="theme-toggle" onclick="toggleTheme()">☀️ Light Mode</button>
    </div>
  </nav>

  <div class="container">
    <div style="margin-bottom: 40px;">
      <h2 style="font-size: 2.5rem; margin-bottom: 10px;">SOAP <span class="gradient-text">Interface</span></h2>
      <p style="color: var(--text-secondary);">Direct XML SOAP envelope communication sent natively via JS fetch.</p>
    </div>

    <div class="api-grid">
      <!-- Place Order -->
      <div class="glass-card">
        <div class="card-header">
          <span class="method post">XML</span> <h3>placeOrder</h3>
        </div>
        <div class="form-group">
          <label>Customer Name</label>
          <input type="text" id="createName" class="glass-input" placeholder="e.g. Alice" />
        </div>
        <div class="form-group">
          <label>Restaurant Name</label>
          <input type="text" id="createRestaurant" class="glass-input" placeholder="e.g. Domino's" />
        </div>
        <div class="form-group">
          <label>Food Items (comma separated)</label>
          <input type="text" id="createItems" class="glass-input" placeholder="e.g. Pizza" />
        </div>
        <div class="form-group">
          <label>Total Amount</label>
          <input type="number" id="createAmount" class="glass-input" placeholder="e.g. 18.50" />
        </div>
        <button class="btn btn-primary" onclick="placeOrder()">Send SOAP Envelope</button>
      </div>

      <!-- Get Order -->
      <div class="glass-card">
        <div class="card-header">
          <span class="method get">XML</span> <h3>getOrderDetails</h3>
        </div>
        <div class="form-group">
          <label>Order ID</label>
          <input type="text" id="getOrderId" class="glass-input" placeholder="e.g. ORD1" />
        </div>
        <button class="btn btn-primary" onclick="getOrder()">Send SOAP Envelope</button>
      </div>

      <!-- Update Status -->
      <div class="glass-card">
        <div class="card-header">
          <span class="method put">XML</span> <h3>updateDeliveryStatus</h3>
        </div>
        <div class="form-group">
          <label>Order ID</label>
          <input type="text" id="updateOrderId" class="glass-input" placeholder="e.g. ORD1" />
        </div>
        <div class="form-group">
          <label>New Status</label>
          <select id="updateStatus" class="glass-input" style="background-color: var(--bg-color);">
            <option value="Placed">Placed</option>
            <option value="Preparing">Preparing</option>
            <option value="Out for Delivery">Out for Delivery</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="updateStatus()">Send SOAP Envelope</button>
      </div>

      <!-- Cancel Order -->
      <div class="glass-card">
        <div class="card-header">
          <span class="method delete">XML</span> <h3>cancelOrder</h3>
        </div>
        <div class="form-group">
          <label>Order ID</label>
          <input type="text" id="cancelOrderId" class="glass-input" placeholder="e.g. ORD1" />
        </div>
        <button class="btn btn-primary" onclick="cancelOrder()">Send SOAP Envelope</button>
      </div>

      <!-- Response Area -->
      <div class="response-panel">
        <div class="response-header">
          <h4>Parsed XML Response Payload</h4>
          <span class="status-badge" id="statusBadge">XML</span>
        </div>
        <pre class="response-body" id="responseBody">Awaiting execution...</pre>
      </div>
    </div>
  </div>

  <script>
    const WSDL_URL = window.location.origin + '/wsdl';

    function renderResponse(status, xmlText) {
      const badge = document.getElementById('statusBadge');
      const body = document.getElementById('responseBody');
      badge.style.display = 'block';
      badge.textContent = `HTTP ${status}`;
      badge.className = 'status-badge ' + (status >= 200 && status < 300 ? 'ok' : 'error');

      // Try to parse the XML cleanly
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        
        // Check for SOAP Faults
        const fault = xmlDoc.getElementsByTagName('Fault')[0];
        if (fault) {
          const faultstring = fault.getElementsByTagName('faultstring')[0]?.textContent || fault.textContent;
          body.textContent = "SOAP FAULT:\n" + faultstring.trim();
          return;
        }

        // Just format the raw XML nicely
        body.textContent = formatXml(xmlText);
      } catch (e) {
        body.textContent = xmlText;
      }
    }

    async function sendSoapRequest(action, bodyXml) {
      const envelope = `<?xml version="1.0" encoding="utf-8"?>
<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:ord="http://www.examples.com/wsdl/OrderService.wsdl">
   <soapenv:Header/>
   <soapenv:Body>
      ${bodyXml}
   </soapenv:Body>
</soapenv:Envelope>`;

      try {
        const res = await fetch(WSDL_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/xml;charset=UTF-8',
            'SOAPAction': action
          },
          body: envelope
        });
        const text = await res.text();
        renderResponse(res.status, text);
      } catch (err) {
        renderResponse(0, err.message);
      }
    }

    function placeOrder() {
      const name = document.getElementById('createName').value.trim();
      const rest = document.getElementById('createRestaurant').value.trim();
      const items = document.getElementById('createItems').value.trim();
      const amount = document.getElementById('createAmount').value.trim();

      sendSoapRequest('placeOrder', `
        <ord:placeOrder>
           <customerName>${name}</customerName>
           <restaurantName>${rest}</restaurantName>
           <foodItems>${items}</foodItems>
           <totalAmount>${amount}</totalAmount>
        </ord:placeOrder>
      `);
    }

    function getOrder() {
      const id = document.getElementById('getOrderId').value.trim();
      sendSoapRequest('getOrderDetails', `
        <ord:getOrderDetails>
           <orderId>${id}</orderId>
        </ord:getOrderDetails>
      `);
    }

    function updateStatus() {
      const id = document.getElementById('updateOrderId').value.trim();
      const status = document.getElementById('updateStatus').value;
      sendSoapRequest('updateDeliveryStatus', `
        <ord:updateDeliveryStatus>
           <orderId>${id}</orderId>
           <status>${status}</status>
        </ord:updateDeliveryStatus>
      `);
    }

    function cancelOrder() {
      const id = document.getElementById('cancelOrderId').value.trim();
      sendSoapRequest('cancelOrder', `
        <ord:cancelOrder>
           <orderId>${id}</orderId>
        </ord:cancelOrder>
      `);
    }

    // Quick XML Formatter
    function formatXml(xml) {
        let formatted = '';
        let reg = /(>)(<)(\/*)/g;
        xml = xml.replace(reg, '$1\r\n$2$3');
        let pad = 0;
        xml.split('\r\n').forEach(function(node) {
            let indent = 0;
            if (node.match( /.+<\/\w[^>]*>$/ )) {
                indent = 0;
            } else if (node.match( /^<\/\w/ )) {
                if (pad != 0) pad -= 1;
            } else if (node.match( /^<\w[^>]*[^\/]>.*$/ )) {
                indent = 1;
            } else {
                indent = 0;
            }
            let padding = '';
            for (let i = 0; i < pad; i++) padding += '  ';
            formatted += padding + node + '\r\n';
            pad += indent;
        });
        return formatted;
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      document.querySelector('.theme-toggle').textContent = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
    }
    if (localStorage.getItem('theme') === 'light') toggleTheme();
  </script>
</body>
</html>
